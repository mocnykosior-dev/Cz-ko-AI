<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Czółko AI - Piosenki</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        .timer-bar {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff007f;
            margin-bottom: 10px;
        }
        .card {
            background: #1e1e2e;
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #333;
            transition: border-color 0.2s ease;
        }
        .category {
            font-size: 1.1rem;
            color: #ff007f;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: #ffffff;
            line-height: 1.2;
        }
        .artist {
            font-size: 1.3rem;
            color: #00f2fe;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .lyric {
            font-size: 1rem;
            font-style: italic;
            color: #aaaaaa;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #ff007f;
        }
        .btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 18px 36px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,242,254,0.4);
        }
        .instructions {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.4;
        }
        .status {
            position: absolute;
            top: 15px;
            font-size: 0.8rem;
            color: #666;
        }
        .score-board {
            font-size: 1.8rem;
            margin: 15px 0;
            color: #00f2fe;
        }
    </style>
</head>
<body onclick="handleTap(event)">

    <div class="status" id="status">Ładowanie bazy...</div>
    <div class="timer-bar" id="timer">60s</div>

    <div class="card" id="card">
        <div class="category" id="category">🎈 CZÓŁKO AI</div>
        <div class="title" id="title">Gotowy na rundę?</div>
        <div class="artist" id="artist">Trzymaj telefon na czole!</div>
        <div class="lyric" id="lyric">Runda trwa 60 sekund. Zgadnięcie = Skłon w dół | Pas = Dotknij ekranu.</div>
        <button class="btn" id="start-btn" onclick="startGame(event)">START GRY</button>
    </div>

    <div class="instructions" id="instructions">
        👇 Przechyl w DÓŁ = Zgadnięte (+1 pkt)<br>
        👆 Dotknij ekranu = PAS (Następna)
    </div>

    <script>
        const SHEET_ID = '1l1vzr1-rhgaR_tUM0Uj1fZhrFuGDpuLT67Bk4WVXT3Q';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let allSongs = [];
        let availableSongs = [];
        let currentSong = null;
        let isCooldown = false;
        let gameActive = false;
        
        let scoreCorrect = 0;
        let scorePassed = 0;
        let timeLeft = 60;
        let timerInterval = null;

        async function fetchSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                
                const rows = json.table.rows;
                allSongs = rows.map(row => ({
                    title: row.c[0] ? row.c[0].v : '',
                    artist: row.c[1] ? row.c[1].v : '',
                    category: row.c[2] ? row.c[2].v : 'Muzyka',
                    lyric: row.c[3] ? row.c[3].v : ''
                })).filter(song => song.title !== '' && song.title !== 'Tytuł');

                document.getElementById('status').innerText = `Wczytano ${allSongs.length} piosenek!`;
            } catch (err) {
                document.getElementById('status').innerText = 'Błąd bazy danych!';
                console.error(err);
            }
        }

        function drawSong() {
            if (availableSongs.length === 0) {
                endGame("Wykorzystano wszystkie piosenki!");
                return;
            }

            // Losowanie bez powtórzeń (usuwamy wylosowaną z puli dostępnych)
            const randomIndex = Math.floor(Math.random() * availableSongs.length);
            currentSong = availableSongs.splice(randomIndex, 1)[0];

            document.getElementById('category').innerText = currentSong.category;
            document.getElementById('title').innerText = currentSong.title;
            document.getElementById('artist').innerText = currentSong.artist;
            document.getElementById('lyric').innerText = currentSong.lyric ? `"${currentSong.lyric}"` : '';
        }

        function startGame(event) {
            if(event) event.stopPropagation();

            // Reset stanu gry
            availableSongs = [...allSongs];
            scoreCorrect = 0;
            scorePassed = 0;
            timeLeft = 60;
            gameActive = true;

            document.getElementById('timer').innerText = `${timeLeft}s`;
            document.getElementById('start-btn').style.display = 'none';

            // Prośba o dostęp do czujników ruchu (iOS/Android)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            window.addEventListener('deviceorientation', handleMotion);
                        }
                    }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleMotion);
            }

            drawSong();

            // Uruchomienie odliczania
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame("Czas minął!");
                }
            }, 1000);
        }

        function handleMotion(event) {
            if (!gameActive || isCooldown) return;

            const beta = event.beta; // Przechylenie przód/tył

            // Skłon telefonu w stronę podłogi (Zgadnięte)
            if (beta > 120 || beta < -120) {
                triggerAction('zgadniete');
            }
        }

        function handleTap(event) {
            // Reaguj tylko podczas trwającej gry
            if (!gameActive || isCooldown) return;
            triggerAction('pas');
        }

        function triggerAction(type) {
            isCooldown = true;
            const card = document.getElementById('card');
            
            if (type === 'zgadniete') {
                scoreCorrect++;
                card.style.borderColor = '#00ff88'; // Zielona ramka
            } else {
                scorePassed++;
                card.style.borderColor = '#ff3366'; // Czerwona ramka
            }

            setTimeout(() => {
                card.style.borderColor = '#333';
                if (gameActive) drawSong();
                isCooldown = false;
            }, 800);
        }

        function endGame(reason) {
            gameActive = false;
            clearInterval(timerInterval);

            document.getElementById('category').innerText = "KONIEC RUNDY!";
            document.getElementById('title').innerText = reason;
            document.getElementById('artist').innerHTML = `
                <div class="score-board">
                    ✅ Zgadnięte: <b>${scoreCorrect}</b><br>
                    ❌ Pas: <b>${scorePassed}</b>
                </div>
            `;
            document.getElementById('lyric').innerText = "Świetna robota! Kliknij poniżej, aby zagrać ponownie.";
            
            const startBtn = document.getElementById('start-btn');
            startBtn.innerText = "ZAGRAJ PONOWNIE";
            startBtn.style.display = 'inline-block';
        }

        fetchSongs();
    </script>
</body>
</html>
