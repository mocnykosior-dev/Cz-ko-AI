<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Czółko AI - Piosenki</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Czółko AI">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; 
            text-align: center;
            padding-top: max(15px, env(safe-area-inset-top));
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            overflow: hidden;
            user-select: none;
        }
        .header-container {
            width: 100%;
            margin-top: 5px;
        }
        .counter-bar {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ff007f;
        }
        .card {
            background: #1e1e2e;
            border-radius: 28px;
            padding: 30px 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 5px solid #333;
            transition: border-color 0.2s ease;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .category {
            font-size: 1.4rem;
            color: #ff007f;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.15;
            word-break: break-word;
        }
        .artist {
            font-size: 2rem;
            color: #00f2fe;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .lyric {
            font-size: 1.3rem;
            font-style: italic;
            color: #dddddd;
            background: rgba(255,255,255,0.08);
            padding: 16px;
            border-radius: 16px;
            border-left: 6px solid #ff007f;
            line-height: 1.3;
        }
        .btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 22px 44px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0,242,254,0.5);
            text-transform: uppercase;
        }
        .instructions {
            margin-bottom: 5px;
            font-size: 1.1rem;
            color: #aaa;
            line-height: 1.4;
            font-weight: 600;
        }
        .status {
            font-size: 0.9rem;
            color: #666;
        }
        .score-board {
            font-size: 2.2rem;
            margin: 20px 0;
            color: #00f2fe;
            line-height: 1.5;
        }
    </style>
</head>
<body onclick="handleTap(event)">

    <div class="header-container">
        <div class="status" id="status">Ładowanie bazy...</div>
        <div class="counter-bar" id="counter">1 / 10</div>
    </div>

    <div class="card" id="card">
        <div class="category" id="category">🎈 CZÓŁKO AI</div>
        <div class="title" id="title">Gotowy na rundę?</div>
        <div class="artist" id="artist">Trzymaj telefon na czole!</div>
        <div class="lyric" id="lyric">Każdy gracz dostaje 10 piosenek. Zgadnięcie = Skłon w dół | Pas = Dotknij ekranu.</div>
        <button class="btn" id="start-btn" onclick="startGame(event)">START GRY</button>
    </div>

    <div class="instructions" id="instructions">
        👇 Skłon w DÓŁ = Zgadnięte (+1 pkt)<br>
        👆 Dotknij ekranu = PAS (Następna)
    </div>

    <script>
        const SHEET_ID = '1l1vzr1-rhgaR_tUM0Uj1fZhrFuGDpuLT67Bk4WVXT3Q';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        const SONGS_PER_ROUND = 10;

        let allSongs = [];
        let availableSongs = [];
        let currentSong = null;
        let isCooldown = false;
        let gameActive = false;
        
        let scoreCorrect = 0;
        let scorePassed = 0;
        let songsPlayedCount = 0;
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock Error:', err);
            }
        }

        async function fetchSongs() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                
                const rows = json.table.rows;
                allSongs = rows.map(row => ({
                    title: row.c[0] ? row.c[0].v : '',
                    artist: row.c[1] ? row.c[1].v : '',
                    category: row.c[2] ? row.c[2].v : 'Muzyka',
                    lyric: row.c[3] ? row.c[3].v : ''
                })).filter(song => song.title !== '' && song.title !== 'Tytuł');

                document.getElementById('status').innerText = `Wczytano ${allSongs.length} piosenek!`;
            } catch (err) {
                document.getElementById('status').innerText = 'Błąd bazy danych!';
                console.error(err);
            }
        }

        function drawSong() {
            if (songsPlayedCount >= SONGS_PER_ROUND) {
                endGame("Runda zakończona!");
                return;
            }

            if (availableSongs.length === 0) {
                availableSongs = [...allSongs];
            }

            const randomIndex = Math.floor(Math.random() * availableSongs.length);
            currentSong = availableSongs.splice(randomIndex, 1)[0];
            songsPlayedCount++;

            document.getElementById('counter').innerText = `${songsPlayedCount} / ${SONGS_PER_ROUND}`;
            document.getElementById('category').innerText = currentSong.category;
            document.getElementById('title').innerText = currentSong.title;
            document.getElementById('artist').innerText = currentSong.artist;
            document.getElementById('lyric').innerText = currentSong.lyric ? `"${currentSong.lyric}"` : '';
        }

        function startGame(event) {
            if(event) event.stopPropagation();

            requestWakeLock();

            if (availableSongs.length < SONGS_PER_ROUND) {
                availableSongs = [...allSongs];
            }

            scoreCorrect = 0;
            scorePassed = 0;
            songsPlayedCount = 0;
            gameActive = true;

            document.getElementById('start-btn').style.display = 'none';

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            window.addEventListener('deviceorientation', handleMotion);
                        }
                    }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleMotion);
            }

            drawSong();
        }

        function handleMotion(event) {
            if (!gameActive || isCooldown) return;

            const beta = event.beta;

            if (beta > 120 || beta < -120) {
                triggerAction('zgadniete');
            }
        }

        function handleTap(event) {
            if (!gameActive || isCooldown) return;
            triggerAction('pas');
        }

        function triggerAction(type) {
            isCooldown = true;
            const card = document.getElementById('card');
            
            if (type === 'zgadniete') {
                scoreCorrect++;
                card.style.borderColor = '#00ff88';
            } else {
                scorePassed++;
                card.style.borderColor = '#ff3366';
            }

            setTimeout(() => {
                card.style.borderColor = '#333';
                if (gameActive) drawSong();
                isCooldown = false;
            }, 800);
        }

        function endGame(reason) {
            gameActive = false;

            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }

            document.getElementById('counter').innerText = "KONIEC!";
            document.getElementById('category').innerText = "PODSUMOWANIE RUNDY";
            document.getElementById('title').innerText = reason;
            document.getElementById('artist').innerHTML = `
                <div class="score-board">
                    ✅ Zgadnięte: <b>${scoreCorrect} / ${SONGS_PER_ROUND}</b><br>
                    ❌ Pas: <b>${scorePassed}</b>
                </div>
            `;
            document.getElementById('lyric').innerText = "Przekaż telefon następnemu graczowi!";
            
            const startBtn = document.getElementById('start-btn');
            startBtn.innerText = "NASTĘPNY GRACZ";
            startBtn.style.display = 'inline-block';
        }

        fetchSongs();
    </script>
</body>
</html>
